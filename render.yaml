# Render Blueprint — https://render.com/docs/blueprint-spec
# One web service: Express serves the API and the built React app.
# Data lives in Supabase (DATABASE_URL); the server migrates it on start.
services:
  - type: web
    name: marketbing
    runtime: node
    plan: free
    # --include=dev: the build needs TypeScript/Vite from devDependencies.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Supabase → Connect → Session pooler URI, with your password filled in.
      # Entered in the Render dashboard; never committed.
      - key: DATABASE_URL
        sync: false
      # Supabase's public root CA (committed), so the TLS connection is verified.
      - key: DATABASE_CA_CERT
        value: ./supabase-ca.crt
      # The sign-in account (see .env.example). Entered in the Render dashboard.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      # Render's proxy sits in front of the app; see TRUST_PROXY in .env.example.
      - key: TRUST_PROXY
        value: "1"
      # Facebook & Instagram: the Meta app's ID and secret (see .env.example).
      # Entered in the Render dashboard. PUBLIC_URL isn't needed here: Render
      # provides RENDER_EXTERNAL_URL, which the server uses instead.
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_LOGIN_CONFIG_ID
        sync: false
